name: CI

# Every gate, on every branch. Pull request snapshots arrive on pr/<number>; cd.yml calls this
# workflow again on main before deploying.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:effect
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
